# Restart configuration entry
switch:
  - platform: restart
    name: "EV Charge Restart"

# XIAO ESP32C3 configuration entry
uart:
  - id: uart_modbus_client
    tx_pin: GPIO21
    rx_pin: GPIO20
    baud_rate: 115200

modbus:
  - uart_id: uart_modbus_client
    id: modbus_client
    role: client

modbus_controller:
  - id: modbus_evse
    modbus_id: modbus_client
    address: 0xE3
    update_interval: 5s
