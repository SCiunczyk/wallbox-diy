substitutions:
  name: "ev-charge"
  friendly_name: ev-charge

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # min_version: 2024.6.0
  # name_add_mac_suffix: false
  # project:
  #   name: esphome.web
  #   version: dev

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

# Enable Home Assistant API
api:
  encryption:
    key: "Your secret key"

  actions:
    - action: set_total
      variables:
        new_total: int
      then:
      - pulse_meter.set_total_pulses:
          id: sensor_ev_pulse_meter
          value: !lambda 'return new_total * 1000;'

# Enable logging
logger:

# Allow Over-The-Air updates
ota:
- platform: esphome

# Allow provisioning Wi-Fi via serial
#improv_serial:

wifi:
  # # use multi wifi networks
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
    priority: 1
  - ssid: !secret wifi_ssid2
    password: !secret wifi_password2
    priority: 2
  - ssid: !secret wifi_ssid3
    password: !secret wifi_password3
    manual_ip:
      static_ip: 192.168.1.125
      gateway: 192.168.1.0
      subnet: 255.255.255.0
    priority: 3
  use_address: ev-charge.local

#  ap: {}

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
#captive_portal:

# Sets up Bluetooth LE (Only on ESP32) to allow the user
# to provision wifi credentials to the device.
#esp32_improv:
#  authorizer: none

# To have a "next url" for improv serial
#web_server:

# EV Power meter configuration entry
sensor:
  - platform: pulse_meter
    name: "Power"
    id: sensor_ev_pulse_meter # Optional ID, necessary if you want to calculate the total daily energy
    unit_of_measurement: 'kW'
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    internal_filter: 200ms
    timeout: 1min
    pin: GPIO3

    filters:
      - multiply: 0.06 # (60s / impulse constant) * (1000W / 1kW)
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1

    total:
      name: "Total Energy"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      accuracy_decimals: 3
      filters:
        - multiply: 0.001  # (1/1000 pulses per kWh)

  # - platform: pulse_counter
  #   name: 'Power'
  #   id: sensor_ev_pulse_meter # Optional ID, necessary if you want to calculate the total daily energy
  #   unit_of_measurement: 'kW'
