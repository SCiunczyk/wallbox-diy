- id: evgridpowerautomation
alias: EVGridPowerAutomation
triggers:
- trigger: time_pattern
  seconds: /5
actions:
- target:
    entity_id:
    - number.ev_charge_grid_power
  data:
    value: '{% if states(''sensor.zemismart_spm02_d2tw_power'')|int < 0 %} {{ 65536
      + states(''sensor.zemismart_spm02_d2tw_power'') | int }} {% else %} {{ states(''sensor.zemismart_spm02_d2tw_power'')
      | int }} {% endif %}'
  action: number.set_value
mode: single
